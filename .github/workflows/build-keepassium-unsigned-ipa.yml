name: Build Unsigned KeePassium IPA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit of keepassium/KeePassium to build"
        required: false
        default: "master"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout KeePassium source
        uses: actions/checkout@v4
        with:
          repository: keepassium/KeePassium
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select latest available Xcode version
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE=/Applications/Xcode.app
          fi
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -workspace KeePassium.xcworkspace -scheme KeePassium

      # Archive for a real device (iphoneos SDK) but with code signing turned
      # off entirely. xcodebuild will produce an .xcarchive containing an
      # unsigned .app you can sign yourself afterwards.
      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -workspace KeePassium.xcworkspace \
            -scheme KeePassium \
            -sdk iphoneos \
            -archivePath build/KeePassium.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      # xcodebuild -exportArchive refuses to export without a valid signing
      # identity/provisioning profile, so we package the unsigned .app into
      # an .ipa manually (an .ipa is just a zip with a specific layout).
      - name: Package unsigned .ipa
        run: |
          set -e
          APP_PATH=$(find build/KeePassium.xcarchive/Products/Applications -maxdepth 1 -name "*.app")
          echo "Found app bundle: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r KeePassium-unsigned.ipa Payload
          cd ..

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: KeePassium-unsigned-ipa
          path: build/KeePassium-unsigned.ipa

      - name: Upload full archive (for debugging/manual re-signing)
        uses: actions/upload-artifact@v4
        with:
          name: KeePassium-xcarchive
          path: build/KeePassium.xcarchive
